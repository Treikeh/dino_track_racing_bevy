[package]
name = "floating_character_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.4.0"
bevy = { version = "0.17.2", features = [
    "dynamic_linking",
    #"hotpatching"
    ] }
bevy-inspector-egui = "0.35.0"

[profile.dev]
opt-level = 1


[profile.dev.package."*"]
opt-level = 3


[profile.release]
codegen-units = 1
